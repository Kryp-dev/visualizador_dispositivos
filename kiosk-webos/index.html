<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    #frame { width: 100%; height: 100%; border: 0; display: block; }

    /* Tela de erro/offline */
    #error {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: #0f1117; color: #e8eaf6;
    }
    #error h1 { font-size: 26px; font-weight: 700; }
    #error p  { font-size: 15px; color: #7b82a0; max-width: 520px; text-align: center; line-height: 1.6; }
    #error button {
      background: #6c63ff; border: 0; border-radius: 8px; color: #fff;
      font-size: 15px; font-weight: 600; padding: 12px 26px; cursor: pointer;
    }

    /* Barra de debug (opcional, desligada por padrao) */
    #debug {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: #7b82a0; font-size: 11px;
      padding: 4px 10px; font-family: monospace; z-index: 99;
    }
  </style>
</head>
<body>
  <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allowfullscreen></iframe>

  <div id="error">
    <h1>Indisponível</h1>
    <p>Não foi possível carregar o visualizador. Verifique se o servidor está no ar e se a URL do kiosk está correta.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>

  <div id="debug"></div>

  <script src="config.js"></script>
  <script>
    (function () {
      // ── Configuracao ──────────────────────────────────────────────────
      var cfg = (typeof window.KIOSK_CONFIG !== 'undefined') ? window.KIOSK_CONFIG : {};
      var frame = document.getElementById('frame');
      var errEl = document.getElementById('error');
      var dbgEl = document.getElementById('debug');

      // Ordem de resolucao da URL do kiosk:
      //   1. launch params do webOS (quando o servidor abre o app com params)
      //   2. query string ?url=...
      //   3. config.js
      function kioskUrl() {
        try {
          if (window.PalmSystem && PalmSystem.launchParams && PalmSystem.launchParams.target) {
            return PalmSystem.launchParams.target;
          }
          if (window.PalmSystem && PalmSystem.launchParams && PalmSystem.launchParams.url) {
            return PalmSystem.launchParams.url;
          }
        } catch (e) {}
        try {
          var m = location.href.match(/[?&]url=([^&]+)/);
          if (m) return decodeURIComponent(m[1]);
        } catch (e) {}
        return cfg.url || '';
      }

      function dbg(msg) {
        if (cfg.showDebug) dbgEl.textContent = msg;
      }

      var URL = kioskUrl();
      var DEFAULT_RELOAD = 60; // segundos

      // se URL vazia -> pede config
      if (!URL) {
        errEl.style.display = 'flex';
        errEl.querySelector('p').textContent =
          'Configuração vazia: defina a URL em config.js (ou abra o app com ?url=...).';
        return;
      }

      function load() {
        if (!URL) return;
        dbg('carregando: ' + URL);
        frame.src = URL;
      }

      // ── Recarregamento periodico (renova a sessao do visualizador) ───
      var reloadSec = cfg.reloadSec || DEFAULT_RELOAD;
      setInterval(function () {
        if (document.visibilityState === 'visible' || !cfg.reloadOnlyVisible) load();
      }, reloadSec * 1000);

      // ── Erro do iframe ────────────────────────────────────────────────
      frame.addEventListener('load', function () {
        errEl.style.display = 'none';
      });
      // some frames nao disparam 'load' quando falham; um healthcheck
      // periodico (liga/desliga) nao e possivel sem acesso a pagina alvo,
      // entao confiamos no reload periodico.

      // ── Medidas de kiosk (best effort em app web) ─────────────────────
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        // Home/Exit/BrowserInvoke: tenta nao deixar o app sumir de vez
        if (e.key === 'BrowserHome' || e.key === 'Exit' || e.key === 'BrowserExit') {
          e.preventDefault();
        }
      });

      // Quando o usuario sai do kiosk (Home/Exit) o app vai para segundo
      // plano; ao voltar, recarrega para nao mostrar estado preso.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && frame.src) {
          dbg('visivel novamente -> reload');
          load();
        }
      });

      // ── Anti-sleep para evitar protecao de tela ─────────────────────
      function applyAntiSleep() {
        try {
          var c = document.createElement('canvas');
          c.width = c.height = 2;
          var ctx = c.getContext('2d');
          function tick() { 
            ctx.fillRect(0,0,2,2); 
            requestAnimationFrame(tick); 
          }
          tick();
          
          var v = document.createElement('video');
          v.style.position = 'fixed';
          v.style.opacity = '0';
          v.style.pointerEvents = 'none';
          v.style.width = '1px';
          v.style.height = '1px';
          v.style.zIndex = '-1';
          v.muted = true; 
          v.loop = true; 
          v.setAttribute('playsinline', '');
          
          v.srcObject = c.captureStream(1);
          document.body.appendChild(v);
          v.play().catch(function(e) { dbg('Anti-sleep erro: ' + e); });
        } catch(e) {
          dbg('Anti-sleep nao suportado: ' + e);
        }
      }
      applyAntiSleep();

      load();
    })();
  </script>
</body>
</html>
